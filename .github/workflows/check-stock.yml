
name: iPhone Duo Stock Alert

on:
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test Bark notification"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: iphone-duo-stock
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check stock and notify
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          PART = "MK2D4ZP/A"
          STORES = {
              "R713": "Apple 台北 101",
              "R694": "Apple 信義 A13",
          }
          STATE = Path("stock-state.json")
          BARK_KEY = os.environ.get("BARK_KEY", "")
          TEST = os.environ.get("TEST_PUSH", "false").lower() == "true"

          if not BARK_KEY:
              raise RuntimeError("BARK_KEY secret is missing")

          def send_bark(title, message):
              payload = json.dumps({
                  "device_key": BARK_KEY,
                  "title": title,
                  "body": message,
                  "group": "iPhone-Duo-Stock",
                  "level": "timeSensitive",
                  "url": "https://www.apple.com/tw/shop/buy-iphone",
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.day.app/push",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)

              if result.get("code") != 200:
                  raise RuntimeError("Bark rejected notification")
              print("Bark notification sent")

          if TEST:
              send_bark(
                  "iPhone Duo 監控測試",
                  "新的 Public GitHub Actions 已成功連接 Bark！",
              )
              raise SystemExit(0)

          url = (
              "https://www.apple.com/tw/shop/retail/pickup-message"
              "?pl=true&parts.0=MK2D4ZP%2FA&location=110"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          body = data.get("body") or {}
          pickup = (body.get("content") or {}).get("pickupMessage") or {}
          stores = body.get("stores") or pickup.get("stores") or []

          statuses = {}
          for store in stores:
              store_id = store.get("storeNumber")
              if store_id not in STORES:
                  continue
              parts = store.get("partsAvailability") or {}
              part = parts.get(PART) or {}
              status = part.get("pickupDisplay")
              if status not in ("available", "unavailable"):
                  raise RuntimeError(
                      f"Unknown pickup status for {store_id}"
                  )
              statuses[store_id] = status

          if set(statuses) != set(STORES):
              raise RuntimeError(
                  "Apple response missing target store data"
              )

          available = sorted(
              store_id for store_id, status in statuses.items()
              if status == "available"
          )
          for store_id, name in STORES.items():
              print(f"{name}: {statuses[store_id]}")

          previous = {}
          if STATE.exists():
              previous = json.loads(STATE.read_text())

          old_available = set(previous.get("available") or [])
          newly_available = set(available) - old_available

          last_sent = previous.get("last_notified_at")
          last_time = None
          if last_sent:
              try:
                  last_time = datetime.fromisoformat(
                      last_sent.replace("Z", "+00:00")
                  )
              except ValueError:
                  print("Invalid previous notification timestamp")

          now = datetime.now(timezone.utc)
          should_notify = bool(available) and (
              bool(newly_available)
              or last_time is None
              or now - last_time >= timedelta(minutes=2)
          )

          if should_notify:
              names = "、".join(STORES[s] for s in available)
              send_bark(
                  "iPhone Duo 有現貨！",
                  f"{names} 可以取貨！星光白色 256GB，"
                  "請立即確認 Apple 官網。",
              )
              last_sent = now.isoformat()
          elif not available:
              last_sent = None
              print("No stock; notifications paused")
          else:
              print("Stock available; waiting for 2-minute interval")

          STATE.write_text(
              json.dumps({
                  "available": available,
                  "last_notified_at": last_sent,
              }, ensure_ascii=False, indent=2) + "\n"
          )
          PY

      - name: Save monitoring state
        if: success() && inputs.test_push != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain -- stock-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock-state.json
            git commit -m "Update stock monitoring state"
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          else
            echo "No state changes"
          fi
